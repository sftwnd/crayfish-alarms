  <text x="200" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#e8ecf6" letter-spacing="-1.5">Crayfish <tspan fill="#ff6a45">Alarms</tspan></text>
  <text x="80" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" fill="#e8ecf6" letter-spacing="-1">Alarms for Java 8+, on time and in order</text>
  <text x="80" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#9aa6c0">A time range that gives out the elements whose moments have come,</text>
  <text x="80" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#9aa6c0">and a service that fires them in one thread.</text>
  <rect x="80" y="404" width="1040" height="64" rx="12" fill="#0f1730" stroke="#26325a"/>
  <text x="108" y="445" font-family="Menlo, Monaco, monospace" font-size="24" fill="#dfe6f5"><tspan fill="#8cc8ff">service</tspan>.process(fired -&gt; fired.forEach(<tspan fill="#8cc8ff">System</tspan>.out::println));</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="548" font-size="40" font-weight="700" fill="#ff6a45">1.6M/s</text>
    <text x="80" y="580" font-size="20" fill="#9aa6c0">alarms in one process</text>
    <text x="360" y="548" font-size="40" font-weight="700" fill="#ff6a45">&lt; 1 ms</text>
    <text x="360" y="580" font-size="20" fill="#9aa6c0">p99 at 400,000 per second</text>
    <text x="640" y="548" font-size="40" font-weight="700" fill="#ff6a45">36 B</text>
    <text x="640" y="580" font-size="20" fill="#9aa6c0">of the heap per Instant</text>
    <text x="890" y="548" font-size="40" font-weight="700" fill="#ff6a45">Java 8+</text>
    <text x="890" y="580" font-size="20" fill="#9aa6c0">JPMS, OSGi, virtual threads</text>
  </g>
